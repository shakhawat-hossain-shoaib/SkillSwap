services:
  database:
    image: mysql:8.0
    container_name: skillswap-mysql-standalone
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: SkillSwapDb
      MYSQL_USER: skillswap_user
      MYSQL_PASSWORD: skillswap_password
    ports:
      - "3306:3306"
    volumes:
      - skillswap_db_standalone_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skillswap_db_standalone_data:
    driver: local
